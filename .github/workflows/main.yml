name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Необязательно: секрет DEEPSEEK_API_KEY вшивает ключ в APK.
      # Settings → Secrets and variables → Actions. Только для приватного репозитория!
      - name: Ключ API (если задан секрет)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "deepseek.apiKey=$DEEPSEEK_API_KEY" >> local.properties
          fi

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWatch-apk
          path: app/build/outputs/apk/debug/app-debug.apk
